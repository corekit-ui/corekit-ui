<div class="space-y-2">
  <h4>Color</h4>

  <div class="flex gap-2">
    <button ckButton type="button">Primary</button>
    <button ckButton color="secondary" type="button">Secondary</button>
    <button ckButton color="success" type="button">Success</button>
    <button ckButton color="warning" type="button">Warning</button>
    <button ckButton color="destructive" type="button">Destructive</button>
  </div>
</div>

<div class="space-y-2">
  <h4>Appearance</h4>

  <div class="flex gap-2">
    <button ckButton type="button">Solid</button>
    <button ckButton appearance="outline" type="button">Outline</button>
    <button ckButton appearance="ghost" type="button">Ghost</button>
  </div>
</div>

<div class="space-y-2">
  <h4>Shape</h4>

  <div class="flex gap-2">
    <button ckButton shape="rectangle" type="button">Rectangle</button>
    <button ckButton shape="pill" type="button">Tablet Pill</button>
    <button ckButton shape="square" type="button" title="Square">
      <lucide-icon name="send" ckAlertIcon />
    </button>
    <button ckButton shape="circle" type="button" title="Circle">
      <lucide-icon name="plus" ckAlertIcon />
    </button>
  </div>
</div>

<div class="space-y-2">
  <h4>Size</h4>

  <div class="flex gap-2">
    <button ckButton color="secondary" size="lg" type="button">Large</button>
    <button ckButton color="secondary" size="md" type="button">Medium</button>
    <button ckButton color="secondary" size="sm" type="button">Small</button>
  </div>
</div>
