<h3>Overview</h3>

<div class="flex items-center gap-2">
  <input
    ckCheckbox
    id="disable-checkbox"
    type="checkbox"
    [(ngModel)]="disabled"
  />
  <label for="disable-checkbox">Disabled</label>
</div>

<div class="flex flex-wrap gap-2">
  <button ckButton type="button" [disabled]="disabled()">Primary</button>
  <button ckButton color="secondary" type="button" [disabled]="disabled()">
    Secondary
  </button>
  <button ckButton color="success" type="button" [disabled]="disabled()">
    Success
  </button>
  <button ckButton color="warning" type="button" [disabled]="disabled()">
    Warning
  </button>
  <button ckButton color="destructive" type="button" [disabled]="disabled()">
    Destructive
  </button>
</div>

<div class="flex flex-wrap gap-2">
  <button ckButton type="button" appearance="outline" [disabled]="disabled()">
    Primary
  </button>
  <button
    ckButton
    color="secondary"
    appearance="outline"
    type="button"
    [disabled]="disabled()"
  >
    Secondary
  </button>
  <button
    ckButton
    color="success"
    appearance="outline"
    type="button"
    [disabled]="disabled()"
  >
    Success
  </button>
  <button
    ckButton
    color="warning"
    appearance="outline"
    type="button"
    [disabled]="disabled()"
  >
    Warning
  </button>
  <button
    ckButton
    color="destructive"
    appearance="outline"
    type="button"
    [disabled]="disabled()"
  >
    Destructive
  </button>
</div>

<div class="flex flex-wrap gap-2">
  <button ckButton type="button" appearance="ghost" [disabled]="disabled()">
    Primary
  </button>
  <button
    ckButton
    color="secondary"
    appearance="ghost"
    type="button"
    [disabled]="disabled()"
  >
    Secondary
  </button>
  <button
    ckButton
    color="success"
    appearance="ghost"
    type="button"
    [disabled]="disabled()"
  >
    Success
  </button>
  <button
    ckButton
    color="warning"
    appearance="ghost"
    type="button"
    [disabled]="disabled()"
  >
    Warning
  </button>
  <button
    ckButton
    color="destructive"
    appearance="ghost"
    type="button"
    [disabled]="disabled()"
  >
    Destructive
  </button>
</div>

<div>
  <h3>Shape</h3>

  <div class="flex flex-wrap gap-2">
    <button ckButton shape="rectangle" type="button">Rectangle</button>
    <button ckButton shape="pill" type="button">Tablet Pill</button>
    <button ckButton shape="square" type="button" title="Square">
      <lucide-icon name="send" ckAlertIcon />
    </button>
    <button ckButton shape="circle" type="button" title="Circle">
      <lucide-icon name="plus" ckAlertIcon />
    </button>
  </div>
</div>

<div>
  <h3>Size</h3>

  <div class="flex flex-wrap gap-2">
    <button ckButton color="secondary" size="lg" type="button">Large</button>
    <button ckButton color="secondary" size="md" type="button">Medium</button>
    <button ckButton color="secondary" size="sm" type="button">Small</button>
  </div>
</div>
