<label class="flex items-center gap-2">
  <input ckCheckbox type="checkbox" [(ngModel)]="disabled" />
  disabled
</label>

<ck-listbox [disabled]="disabled()" [multiple]="false">
  @for (option of options; track option) {
    <ck-listbox-option [value]="option.value">
      {{ option.label }}
    </ck-listbox-option>
  }
</ck-listbox>
