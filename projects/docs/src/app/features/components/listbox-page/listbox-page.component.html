<label class="flex items-center gap-2">
  <input ckCheckbox type="checkbox" [(ngModel)]="multiple" />
  multiple
</label>

<label class="flex items-center gap-2">
  <input ckCheckbox type="checkbox" [(ngModel)]="disabled" />
  disabled
</label>

<ck-listbox
  [disabled]="disabled()"
  [multiple]="multiple()"
  [(ngModel)]="selected"
>
  @for (option of options; track option) {
    <ck-option [value]="option.value" [disabled]="option.disabled">
      {{ option.label }}
    </ck-option>
  }
</ck-listbox>

<p>Value: {{ selected() | json }}</p>
