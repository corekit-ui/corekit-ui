<ck-tab-group>
  <ck-tab label="First">Content 1</ck-tab>
  <ck-tab label="Second" disabled>Content 2</ck-tab>
  <ck-tab label="Third">
    <ng-template ckTabContent>Content 3</ng-template>
  </ck-tab>
  <ck-tab>
    <ng-template ck-tab-label>Custom Label</ng-template>
    Content 4
  </ck-tab>
</ck-tab-group>

<nav ck-tab-nav-bar [tabPanel]="tabPanel">
  @for (link of links; track link) {
    <a
      ck-tab-link
      href="#"
      [active]="activeLink === link"
      (click)="activeLink = link"
    >
      {{ link }}
    </a>
  }
  <a ck-tab-link disabled>Disabled Link</a>
</nav>
<ck-tab-nav-panel #tabPanel />
