<ng-template #content>
  <ng-content />
</ng-template>

@if (_hasProjectedContent()) {
  <ng-container *ngTemplateOutlet="content" />
} @else if (appearance() === 'icon') {
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
  >
    <path d="M18 6 6 18" />
    <path d="m6 6 12 12" />
  </svg>
}
