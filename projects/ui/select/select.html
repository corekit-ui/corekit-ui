<span
  class="pointer-events-none truncate"
  [ngClass]="{
    'text-muted-foreground in-[.ck-invalid]:text-destructive/70':
      !displayValue(),
  }"
>
  {{ displayValue() || placeholder() }}
</span>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="16"
  height="16"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  class="shrink-0 opacity-50"
>
  <path d="m6 9 6 6 6-6" />
</svg>

<ng-template #template>
  <div
    #panel
    role="listbox"
    [id]="panelId"
    [class]="_panelClass()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="_ariaLabelledby()"
    (mousedown)="$event.preventDefault()"
    (animationend)="_onPanelAnimationEnd($event)"
  >
    <ng-content />
  </div>
</ng-template>
