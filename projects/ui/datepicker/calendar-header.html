<button
  type="button"
  [attr.aria-label]="previousButtonLabel()"
  [class]="_buttonClass"
  [disabled]="previousDisabled()"
  (click)="previous.emit()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="rtl:rotate-180"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="m15 18-6-6 6-6" />
  </svg>
</button>

<button
  type="button"
  [attr.aria-label]="periodButtonLabel()"
  [class]="_labelClass"
  (click)="periodClicked.emit()"
>
  <span role="status" aria-live="polite">{{ label() }}</span>
</button>

<button
  type="button"
  [attr.aria-label]="nextButtonLabel()"
  [class]="_buttonClass"
  [disabled]="nextDisabled()"
  (click)="next.emit()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="rtl:rotate-180"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="m9 18 6-6-6-6" />
  </svg>
</button>
