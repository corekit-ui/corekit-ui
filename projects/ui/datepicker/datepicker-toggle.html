<button
  type="button"
  [attr.aria-label]="_intl.openCalendarLabel"
  [attr.aria-haspopup]="'dialog'"
  [attr.aria-expanded]="for().isOpen()"
  [class]="_buttonClass"
  [disabled]="isDisabled()"
  (click)="_toggle()"
>
  <!-- Project custom icon content to replace the default calendar icon. -->
  <!-- The rule doesn't know about `ng-content` fallback content yet. -->
  <!-- eslint-disable @angular-eslint/template/prefer-self-closing-tags -->
  <ng-content>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="size-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M8 2v4" />
      <path d="M16 2v4" />
      <rect width="18" height="18" x="3" y="4" rx="2" />
      <path d="M3 10h18" />
    </svg>
  </ng-content>
  <!-- eslint-enable @angular-eslint/template/prefer-self-closing-tags -->
</button>
